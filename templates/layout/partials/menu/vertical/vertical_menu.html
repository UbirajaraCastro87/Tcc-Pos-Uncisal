<aside id="layout-menu" class="layout-menu menu-vertical menu">
  <!-- Logo do Sistema -->
  {% if not navbar_full %}
  <div class="app-brand demo">
    <a href="{% url 'index' %}" class="app-brand-link">
      <span class="app-brand-logo demo me-1">
        {% include 'partials/logo.html' %}
      </span>
      <span class="app-brand-text demo menu-text fw-semibold ms-2">{% get_theme_variables 'template_name' %}</span>
    </a>
  </div>
  {% endif %}

  <div class="menu-inner-shadow"></div>

  <ul class="menu-inner py-1">

    <!-- Dashboard (Analytics) -->
    <li class="menu-item {% if 'index' == request.resolver_match.url_name %}active{% endif %}">
      <a href="{% url 'index' %}" class="menu-link">
        <i class="menu-icon icon-base ri ri-home-smile-line"></i>
        <div class="text-truncate">Painel Principal</div>
      </a>
    </li>

    <!-- Cabeçalho de Gestão -->
    <li class="menu-header mt-7">
      <span class="menu-header-text">Gerenciamento</span>
    </li>

    <!-- Adicionar Usuário -->
    <li class="menu-item {% if 'auth-add-user' == request.resolver_match.url_name %}active{% endif %}">
      <a href="{% url 'auth-add-user' %}" class="menu-link">
        <i class="menu-icon icon-base ri ri-user-add-line"></i>
        <div class="text-truncate">Adicionar Usuário</div>
      </a>
    </li>
<!-- Histórico de Logs -->
    <li class="menu-item {% if 'user-logs' == request.resolver_match.url_name %}active{% endif %}">
      <a href="{% url 'user-logs' %}" class="menu-link">
        <i class="menu-icon icon-base ri ri-history-line"></i>
        <div class="text-truncate">Logs de Acesso</div>
      </a>
    </li>
  
    <!-- Sair do Sistema -->
    <li class="menu-item">
      <a href="{% url 'auth-logout' %}" class="menu-link">
        <i class="menu-icon icon-base ri ri-logout-box-r-line"></i>
        <div class="text-truncate">Sair</div>
      </a>
    </li>

  </ul>
</aside>
